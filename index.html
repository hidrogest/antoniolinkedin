<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria de Perfil - Hidrogest (Antônio)</title>
  
  <!-- Importando o Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Importando React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Importando o Babel para rodar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Estilos Customizados -->
  <style>
    @keyframes pulse-subtle {
      0%, 100% { border-color: rgba(248, 113, 113, 0.4); background-color: rgba(254, 226, 226, 0.4); }
      50% { border-color: rgba(239, 68, 68, 1); background-color: rgba(254, 226, 226, 0.8); }
    }
    .animate-pulse-subtle { 
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
    }
  </style>
</head>
<body class="bg-[#f3f2ef]">

  <!-- Elemento onde o React será montado -->
  <div id="root"></div>

  <!-- Código da Aplicação -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const AlertCircle = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const CheckCircle2 = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const MapPin = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
    const Mail = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
    const Phone = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
    const LinkIcon = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
    const ChevronRight = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
    const Info = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
    const ShieldCheck = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>;
    const XCircle = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>;
    const DownloadIcon = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const CopyIcon = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;

    function App() {
      const [isOptimized, setIsOptimized] = useState(false);
      const [animateProgress, setAnimateProgress] = useState(false);
      const [showCopyModal, setShowCopyModal] = useState(false);
      const [toastMsg, setToastMsg] = useState("");

      // FOTOS DO ANTÔNIO
      const imgBefore = "https://drive.google.com/thumbnail?id=1oVlnmBTZLUafU_TOQ26-Zjz2XQb6JOLJ&sz=w800";
      const imgAfter = "https://drive.google.com/thumbnail?id=1AH0rJgBvi-VJD57QhcbwWZEp7yiOv91j&sz=w800";
      const imgAfterDownload = "https://drive.google.com/uc?export=download&id=1AH0rJgBvi-VJD57QhcbwWZEp7yiOv91j";
      
      // CAPAS
      const bgBefore = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII="; // Placeholder cinza para o vazio
      const bgAfter = "https://drive.google.com/thumbnail?id=1iiTd34l2WagIurFg5IZFl2i4QsY1Dj3Z&sz=w1200"; 
      const bgAfterDownload = "https://drive.google.com/uc?export=download&id=1iiTd34l2WagIurFg5IZFl2i4QsY1Dj3Z";

      // LOGOS
      const logoHidrogest = "https://drive.google.com/thumbnail?id=1aWt-ZBZIvBdviJ3hoYVExMUoQlFEt15O&sz=w200";
      const logoCemig = "https://upload.wikimedia.org/wikipedia/commons/4/4b/Cemig_logo.png"; // Placeholder genérico para ilustrar a cemig
      
      const fallbackAvatar = "https://ui-avatars.com/api/?name=Antonio+Machado&size=200&background=0a66c2&color=fff";

      useEffect(() => {
        setAnimateProgress(false);
        const timer = setTimeout(() => setAnimateProgress(true), 100);
        return () => clearTimeout(timer);
      }, [isOptimized]);

      const handleCopyText = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          setToastMsg("Copiado com sucesso!");
        } catch (err) {
          setToastMsg("Erro ao copiar.");
        }
        document.body.removeChild(textArea);
        setTimeout(() => setToastMsg(""), 3000);
      };

      const copyTexts = {
        titulo: "Sócio Diretor & Engenheiro Responsável Técnico | Hidrometria | Hidrologia | Sedimentometria | Telemetria | Gestão de Recursos Hídricos",
        sobre: `Engenheiro Civil com mais de 45 anos de atuação em hidrometria.\n\nComo Sócio Diretor e Responsável Técnico da Hidrogest Engenharia, dedico-me a entregar soluções de ponta em gestão de recursos hídricos. Lidero operações complexas de monitoramento hidrossedimentológico e telemetria para projetos críticos de nível nacional (Vale, Fundação Renova).\n\nNosso foco na Hidrogest é a precisão absoluta e a segurança técnica dos dados que movem o planejamento hidroenergético brasileiro.`,
        experienciaHidrogest: `Coordenação técnica e direção executiva de grandes projetos de monitoramento hidrossedimentológico (ex: Vale/Potamos no Rio Paraopeba).\nImplantação de redes de monitoramento para a Fundação Renova (Mariana, Dique S4, Lagoa Juparana) e atendimento a resoluções da ANEEL/ANA para diversas PCHs e UHEs.\nElaboração de curvas CAV e batimetria de reservatórios.`,
        experienciaCemig: `Coordenação do setor de Hidrometria e ampliação da Rede Hidrometeorológica, sedimentométrica e telemétrica.\nParticipação nos estudos para implantação de grandes usinas (Nova Ponte, Miranda, Igarapava, Aimorés, Funil, Irapé).\nEstágio Internacional no USGS (EUA) em 1995.`,
        formacao: `• Escola de Engenharia Kennedy (EEK)\nEngenharia Civil (1980)`,
        competencias: `Hidrometria\nHidrologia\nSedimentometria\nTelemetria\nGestão de Recursos Hídricos\nTopobatimetria\nGestão de Projetos\nLiderança Executiva`
      };

      const Highlight = ({ condition, isFixed, label, description, children, block = false, hideFixedBorder = false }) => {
        if (!condition) return <>{children}</>;

        const baseStyles = block ? 'block' : 'inline-block';
        const fixedStyles = hideFixedBorder 
          ? 'border-transparent bg-transparent'
          : 'border-green-400 bg-green-50/50 shadow-[0_0_15px_rgba(74,222,128,0.2)]';
        const errorStyles = 'border-red-400 bg-red-50 animate-pulse-subtle shadow-[0_0_15px_rgba(248,113,113,0.3)]';

        return (
          <div className={`relative group ${baseStyles} mb-1`}>
            <div className={`
              ${baseStyles} 
              border-2 border-dashed rounded-lg p-1.5 -m-1.5 transition-all duration-700 ease-in-out
              ${isFixed ? fixedStyles : errorStyles}
            `}>
              {children}
            </div>
            
            <div className={`
              absolute z-50 bottom-full left-1/2 -translate-x-1/2 mb-3 w-64 p-3 rounded-lg shadow-xl
              transform transition-all duration-300 ease-out origin-bottom
              opacity-0 scale-95 group-hover:opacity-100 group-hover:scale-100 pointer-events-none
              ${isFixed ? 'bg-green-800 text-white' : 'bg-red-700 text-white'}
            `}>
              <div className="flex items-start gap-2">
                {isFixed ? <CheckCircle2 className="shrink-0 mt-0.5" size={16} /> : <AlertCircle className="shrink-0 mt-0.5" size={16} />}
                <div>
                  <p className="font-bold text-sm mb-1">{label}</p>
                  {description && <p className="text-xs opacity-90 leading-tight">{description}</p>}
                </div>
              </div>
              <div className={`absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 rotate-45 ${isFixed ? 'bg-green-800' : 'bg-red-700'}`}></div>
            </div>
          </div>
        );
      };

      const checklistItems = [
        { id: 1, text: "Correção da Empresa Atual para Hidrogest", done: isOptimized },
        { id: 2, text: "Foto Corporativa de Sócio Diretor", done: isOptimized },
        { id: 3, text: "Inclusão de Banner Institucional", done: isOptimized },
        { id: 4, text: "Resumo Objetivo e Autoridade", done: isOptimized },
        { id: 5, text: "Inclusão de Contatos Visíveis", done: isOptimized },
      ];

      return (
        <div className="min-h-screen font-sans pb-16 selection:bg-blue-200">
          
          <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[100] transition-all duration-500 ${toastMsg ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
            <div className="bg-green-800 text-white px-6 py-3 rounded-full shadow-2xl font-bold flex items-center gap-2">
              <CheckCircle2 size={20} />
              {toastMsg}
            </div>
          </div>

          <div className="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-md">
            <div className="max-w-5xl mx-auto px-4 py-4">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                
                <div className="flex items-center gap-3">
                  <div className="bg-[#0B3B59] text-white p-2.5 rounded-lg shadow-sm">
                    <ShieldCheck size={24} />
                  </div>
                  <div>
                    <h1 className="font-bold text-xl text-gray-900 leading-tight">Auditoria de Perfil</h1>
                    <p className="text-sm text-gray-500">Diretoria: Antônio José Machado</p>
                  </div>
                </div>

                <div className="flex-1 max-w-md w-full px-4">
                  <div className="flex justify-between text-sm mb-1.5 font-medium">
                    <span className="text-gray-600">Força do Perfil</span>
                    <span className={isOptimized ? "text-green-600" : "text-red-600"}>
                      {isOptimized ? "Campeão Institucional (100%)" : "Desatualizado (20%)"}
                    </span>
                  </div>
                  <div className="h-2.5 w-full bg-gray-100 rounded-full overflow-hidden shadow-inner">
                    <div 
                      className={`h-full rounded-full transition-all duration-1000 ease-out relative ${
                        isOptimized ? "bg-green-500" : "bg-red-400"
                      }`}
                      style={{ width: animateProgress ? (isOptimized ? "100%" : "20%") : "0%" }}
                    >
                      <div className="absolute top-0 left-0 bottom-0 right-0 bg-white/20 animate-pulse"></div>
                    </div>
                  </div>
                </div>

                <div className="flex bg-gray-100 p-1 rounded-lg border border-gray-200 shadow-inner">
                  <button
                    onClick={() => setIsOptimized(false)}
                    className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all duration-300 ${
                      !isOptimized ? 'bg-white shadow-sm text-red-600 ring-1 ring-gray-200' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    <XCircle size={16} className={!isOptimized ? "animate-pulse" : ""} />
                    Perfil Atual
                  </button>
                  <button
                    onClick={() => setIsOptimized(true)}
                    className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all duration-300 ${
                      isOptimized ? 'bg-[#0a66c2] shadow-md text-white ring-1 ring-blue-600' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    <CheckCircle2 size={16} />
                    Otimizado
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div className="max-w-5xl mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            {}
            <div className="lg:col-span-1 space-y-4">
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 sticky top-28">
                <h3 className="font-bold text-gray-900 mb-4 flex items-center gap-2">
                  <Info size={18} className="text-[#0B3B59]" />
                  Pontos Críticos
                </h3>
                
                <ul className="space-y-3">
                  {checklistItems.map(item => (
                    <li key={item.id} className="flex items-start gap-3 transition-all duration-300">
                      <div className={`mt-0.5 rounded-full transition-colors duration-300 ${item.done ? 'text-green-500' : 'text-gray-300'}`}>
                        <CheckCircle2 size={18} />
                      </div>
                      <span className={`text-sm ${item.done ? 'text-gray-800 font-medium' : 'text-gray-500'}`}>
                        {item.text}
                      </span>
                    </li>
                  ))}
                </ul>

                <div className={`mt-6 p-4 rounded-lg text-sm transition-all duration-500 ${
                  isOptimized ? 'bg-green-50 border border-green-200 text-green-800' : 'bg-red-50 border border-red-200 text-red-800'
                }`}>
                  <p className="font-bold mb-1">{isOptimized ? 'Autoridade Restaurada!' : 'Erro Institucional Grave:'}</p>
                  <p>
                    {isOptimized 
                      ? 'O perfil agora projeta perfeitamente a imagem de Sócio Diretor, destacando os 45 anos de experiência e a força da Hidrogest.' 
                      : 'O perfil antigo indicava erroneamente que ele ainda trabalha na CEMIG e ocultava a posição dele como líder da Hidrogest há quase 20 anos.'}
                  </p>
                </div>

                <div className={`mt-4 transition-all duration-500 overflow-hidden ${isOptimized ? 'max-h-32 opacity-100' : 'max-h-0 opacity-0'}`}>
                  <button 
                    onClick={() => setShowCopyModal(true)}
                    className="w-full flex items-center justify-center gap-2 bg-[#0B3B59] hover:bg-[#082a40] text-white px-4 py-3 rounded-lg font-bold text-sm shadow-md transition-all hover:scale-[1.02]"
                  >
                    <CopyIcon size={18} />
                    Copiar Textos do Perfil
                  </button>
                </div>

              </div>
            </div>

            {}
            <div className="lg:col-span-3 space-y-4 relative">
              
              <div className="absolute -right-2 -top-6 text-sm font-bold text-gray-400 flex items-center gap-1 uppercase tracking-wider">
                Visão de Mercado / Parceiros <ChevronRight size={14}/>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative transition-all duration-500 hover:shadow-md">
                
                <Highlight 
                  condition={true} 
                  isFixed={isOptimized} 
                  hideFixedBorder={true}
                  label={isOptimized ? "Banner Atualizado" : "Perfil Sem Identidade"} 
                  description={isOptimized ? "A nova arte cria uma vitrine institucional forte para a empresa que ele fundou e dirige." : "O perfil não possuía imagem de capa, aparentando abandono."}
                  block
                >
                  <div className="w-full relative overflow-hidden group/banner bg-gray-300" style={{ aspectRatio: '10/3', minHeight: '120px' }}>
                    {/* Capa Antiga (Vazia/Cinza) */}
                    <img 
                      src={bgBefore} 
                      alt="Capa Antiga" 
                      className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ${isOptimized ? 'opacity-0' : 'opacity-100'}`}
                    />
                    
                    {/* Nova Capa */}
                    <img 
                      src={bgAfter} 
                      alt="Capa Hidrogest" 
                      className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ${isOptimized ? 'opacity-100' : 'opacity-0'}`}
                    />

                    {/* Botão de Download */}
                    <div className={`absolute top-3 right-3 sm:top-4 sm:right-4 transition-all duration-500 z-10 ${isOptimized ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
                      <a 
                        href={bgAfterDownload} 
                        download="Capa_Hidrogest_Antonio.jpg"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center gap-1.5 sm:gap-2 bg-white/95 hover:bg-white text-[#0B3B59] px-3 sm:px-4 py-1.5 sm:py-2 rounded-full font-bold text-xs sm:text-sm shadow-lg transition-all border border-transparent hover:border-[#0B3B59] hover:scale-105"
                        title="Baixar nova capa"
                      >
                        <DownloadIcon size={16} />
                        <span className="hidden sm:inline">Baixar Capa</span>
                        <span className="sm:hidden">Baixar</span>
                      </a>
                    </div>
                  </div>
                </Highlight>

                <div className="px-4 sm:px-6 pb-6 relative">
                  
                  {/* Foto de Perfil */}
                  <div className="relative -mt-16 sm:-mt-20 md:-mt-24 mb-3 z-20 inline-block">
                    <Highlight 
                      condition={true} 
                      isFixed={isOptimized} 
                      hideFixedBorder={true}
                      label={isOptimized ? "Foto Institucional de Diretoria" : "Foto Informal"}
                      description={isOptimized ? "A postura mais séria e vestimenta formal transmitem o peso e a excelência técnica de um Sócio Diretor." : "A foto anterior era ótima, mas tinha um tom mais informal e descontraído, não projetando a total autoridade do cargo atual."}
                    >
                      <div className="w-28 h-28 sm:w-36 sm:h-36 md:w-40 md:h-40 rounded-full border-4 border-white bg-white shadow-md relative group/photo">
                        <img 
                          src={isOptimized ? imgAfter : imgBefore} 
                          alt="Foto de perfil" 
                          className="w-full h-full object-cover rounded-full transition-transform duration-700 group-hover/photo:scale-105"
                          onError={(e) => { e.target.src = fallbackAvatar }}
                        />
                        <div className="absolute inset-0 ring-1 ring-black/10 rounded-full pointer-events-none"></div>
                        
                        {/* Botão de Download da Foto de Perfil */}
                        <div className={`absolute bottom-0 right-0 sm:bottom-1 sm:right-1 transition-all duration-500 z-30 ${isOptimized ? 'opacity-100 scale-100' : 'opacity-0 scale-50 pointer-events-none'}`}>
                          <a 
                            href={imgAfterDownload} 
                            download="Foto_Perfil_Antonio_Hidrogest.jpg"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="flex items-center justify-center bg-white text-[#0B3B59] w-8 h-8 sm:w-10 sm:h-10 rounded-full shadow-lg border border-gray-200 hover:bg-gray-50 hover:scale-110 transition-all"
                            title="Baixar foto de perfil"
                          >
                            <DownloadIcon size={16} />
                          </a>
                        </div>
                      </div>
                    </Highlight>
                  </div>

                  {}
                  <div className="flex flex-col sm:flex-row justify-between items-start gap-4">
                    <div className="max-w-xl">
                      <h1 className="text-xl sm:text-2xl font-bold text-gray-900 leading-tight">
                        Antônio José Machado
                      </h1>

                      <div className="text-[16px] sm:text-[17px] text-gray-700 mt-1.5 leading-snug">
                        <Highlight 
                          condition={!isOptimized || isOptimized} 
                          isFixed={isOptimized} 
                          label={isOptimized ? "Título de Alto Escalão" : "Empresa Errada no Título"}
                          description={isOptimized ? "Posiciona-o corretamente como o principal líder técnico e sócio da Hidrogest." : "O título antigo dizia ao mercado que ele ainda representava a CEMIG, o que é um erro de imagem grave para a Hidrogest."}
                          block
                        >
                          {isOptimized 
                            ? "Sócio Diretor & Engenheiro Responsável Técnico | Hidrometria | Hidrologia | Sedimentometria | Telemetria | Gestão de Recursos Hídricos"
